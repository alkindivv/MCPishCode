<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1121"/>
      <stop offset="100%" stop-color="#1A233A"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.15"/>

  <!-- Icon mark: stylized "M" as abstract signal/cube nodes -->
  <g transform="translate(256, 180)">
    <!-- Left tower -->
    <rect x="-96" y="-80" width="32" height="160" rx="16" fill="url(#grad1)"/>
    <!-- Middle tower -->
    <rect x="-16" y="-120" width="32" height="200" rx="16" fill="url(#grad1)"/>
    <!-- Right tower -->
    <rect x="64" y="-80" width="32" height="160" rx="16" fill="url(#grad1)"/>

    <!-- Connecting bridge left -->
    <line x1="-64" y1="-20" x2="-16" y2="-60" stroke="url(#grad2)" stroke-width="12" stroke-linecap="round"/>
    <!-- Connecting bridge right -->
    <line x1="16" y1="-60" x2="64" y2="-20" stroke="url(#grad2)" stroke-width="12" stroke-linecap="round"/>

    <!-- Data dots on bridges -->
    <circle cx="-40" cy="-40" r="6" fill="#38BDF8"/>
    <circle cx="40" cy="-40" r="6" fill="#C084FC"/>
  </g>

  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="44" font-weight="800" letter-spacing="6" fill="url(#grad1)">
    MCPishCode
  </text>

  <!-- Subtitle -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="500" letter-spacing="8" fill="#64748B">
    MCP PROTOCOL WORKSPACE
  </text>
</svg>
