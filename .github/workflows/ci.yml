name: CI

on:
  push:
    branches:
      - main
      - feat/mcpishcode-lean-upstream
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Text-only E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    env:
      MCPISHCODE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck runtime
        run: pnpm typecheck

      - name: Verify generated config schema
        run: |
          pnpm schema:config
          git diff --exit-code -- schema

      - name: Build and run isolated OAuth/MCP text-only E2E
        run: pnpm test

      - name: Verify packed runtime and repeat text-only E2E
        run: pnpm test:package

      - name: Run CLI version smoke
        run: node dist/cli.js --version

      - name: Upload sanitized E2E evidence and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-only-evidence-${{ matrix.os }}
          path: |
            artifacts/*.json
            artifacts/*.tgz
          if-no-files-found: warn
          retention-days: 14
