name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    env:
      MCPISHCODE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck runtime
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Run CLI version smoke
        run: node dist/cli.js --version
